<template>
    <lightning-card title="Customer Map" icon-name="standard:account">
        <div class="toolbar slds-p-horizontal_medium slds-p-top_medium slds-p-bottom_small">
            <div class="toolbar-copy">
                <p class="toolbar-title">Customer locations</p>
                <p class="toolbar-subtitle">{resultSummary}</p>
                <div class="legend" aria-label="Segmentation legend">
                    <template for:each={segmentationLegend} for:item="item">
                        <span key={item.key} class="legend-item">
                            <span class="legend-swatch" style={item.style}></span>
                            <span>{item.label}</span>
                        </span>
                    </template>
                </div>
            </div>
            <div class="toolbar-filter">
                <lightning-combobox
                    label="Country"
                    variant="label-hidden"
                    placeholder="Filter by country"
                    value={selectedCountry}
                    options={countryOptions}
                    onchange={handleCountryChange}
                >
                </lightning-combobox>
            </div>
        </div>
        <template if:true={hasMarkers}>
            <div class="content slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="map-panel">
                    <div class="map-container">
                        <lightning-map
                            map-markers={mapMarkers}
                            center={mapCenter}
                            zoom-level={zoomLevel}
                            markers-title="Customers"
                            onmarkerselect={handleMarkerSelect}
                            selected-marker-value={selectedMarkerValue}
                            list-view="hidden"
                        >
                        </lightning-map>
                    </div>
                </div>
                <aside class="list-panel" aria-label="Customer list">
                    <div class="list-header">
                        <p class="list-title">Customers</p>
                        <p class="list-subtitle">{listSummary}</p>
                    </div>
                    <div class="customer-list">
                        <template for:each={visibleListAccounts} for:item="account">
                            <button
                                key={account.recordId}
                                class={account.itemClass}
                                data-record-id={account.recordId}
                                onclick={handleListItemClick}
                                type="button"
                            >
                                <span class="customer-item__name">{account.accountName}</span>
                                <span class="customer-item__meta">{account.countryLabel}</span>
                                <span class="customer-item__address">{account.description}</span>
                            </button>
                        </template>
                    </div>
                </aside>
            </div>
        </template>
        <template if:true={errorMessage}>
            <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
        </template>
        <template if:true={showEmptyState}>
            <div class="slds-p-around_medium slds-text-body_regular">
                No accounts match the selected filters.
            </div>
        </template>
    </lightning-card>
</template>
