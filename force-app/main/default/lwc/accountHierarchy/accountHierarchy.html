<template>
    <lightning-card title="Corporate Account Hierarchy" icon-name="standard:account">
        <div class="slds-var-p-horizontal_medium slds-var-p-top_medium slds-var-p-bottom_small">
            <p class="slds-text-title_caps slds-var-m-bottom_xx-small">Hierarchy explorer</p>
            <p class="slds-text-body_small slds-text-color_weak">{summary}</p>
        </div>

        <div class="workspace slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <aside class="sidebar slds-box slds-theme_default">
                <lightning-input
                    type="search"
                    label="Find a global account"
                    value={searchKey}
                    onchange={handleSearchChange}
                    placeholder="Search global account names"
                ></lightning-input>

                <div class="sidebar-meta slds-text-body_small slds-text-color_weak">
                    Only accounts with the `Global account` checkbox selected
                </div>

                <template if:true={isLoadingParents}>
                    <div class="slds-var-p-vertical_medium">
                        <lightning-spinner size="small" alternative-text="Loading global accounts"></lightning-spinner>
                    </div>
                </template>

                <template if:true={hasParents}>
                    <div class="parent-list" role="listbox" aria-label="Global accounts">
                        <template for:each={parentOptions} for:item="parent">
                            <button
                                key={parent.recordId}
                                class={parent.itemClass}
                                data-record-id={parent.recordId}
                                onclick={handleSelectParent}
                                type="button"
                            >
                                <span class="parent-item__name">{parent.name}</span>
                                <span class="parent-item__meta">
                                    {parent.directChildCount} direct children
                                </span>
                                <span class="parent-item__meta">
                                    {parent.totalContactCount} contacts
                                </span>
                            </button>
                        </template>
                    </div>
                </template>

                <template if:true={showEmptyState}>
                    <div class="slds-text-body_small slds-text-color_weak slds-var-p-top_medium">
                        No global accounts match the current search.
                    </div>
                </template>
            </aside>

            <section class="detail slds-box slds-theme_default">
                <template if:true={isLoadingHierarchy}>
                    <div class="detail-loading">
                        <lightning-spinner size="small" alternative-text="Loading hierarchy"></lightning-spinner>
                    </div>
                </template>

                <template if:true={hasSelectedHierarchy}>
                    <div class="detail-header">
                        <div>
                            <button
                                class="parent-link slds-button_reset slds-text-heading_medium"
                                data-record-id={displayedHierarchy.recordId}
                                data-object-api-name="Account"
                                onclick={handleNavigate}
                                type="button"
                            >
                                {displayedHierarchy.name}
                            </button>
                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                                {selectedSummary}
                            </p>
                        </div>
                        <div class="hero-actions">
                            <span class="hero-pill">{displayedHierarchy.directChildCount} direct children</span>
                            <span class="hero-pill hero-pill_contacts">
                                {displayedHierarchy.totalContactCount} contacts
                            </span>
                            <lightning-button
                                label={toggleAllBranchesLabel}
                                onclick={handleToggleAllBranches}
                                variant="neutral"
                            ></lightning-button>
                            <lightning-button
                                label={toggleAllContactsLabel}
                                onclick={handleToggleAllContacts}
                                variant="neutral"
                            ></lightning-button>
                        </div>
                    </div>

                    <div class="detail-filters">
                        <lightning-input
                            type="search"
                            label="Filter visible hierarchy"
                            value={detailSearchKey}
                            onchange={handleDetailSearchChange}
                            placeholder="Filter by account name or contact name"
                        ></lightning-input>
                    </div>

                    <div class="tree-shell">
                        <c-account-hierarchy-node
                            node={displayedHierarchy}
                            is-root
                            expand-all-contacts={allContactsExpanded}
                            contact-toggle-signal={contactToggleSignal}
                            expand-all-branches={allBranchesExpanded}
                            branch-toggle-signal={branchToggleSignal}
                            onnavigate={handleNavigate}
                        ></c-account-hierarchy-node>
                    </div>
                </template>

                <template if:false={hasSelectedHierarchy}>
                    <div class="slds-text-body_small slds-text-color_weak">
                        Select a global account to load its hierarchy.
                    </div>
                </template>
            </section>
        </div>

        <template if:true={errorMessage}>
            <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium slds-text-color_error">
                {errorMessage}
            </div>
        </template>
    </lightning-card>
</template>
